name: Deploy Bootnode Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/bootnode-docs/**'
      - 'packages/**'
      - '.hanzo/workflows/deploy-bootnode-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: hanzo-docs-build-linux-amd64
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=bootnode-docs
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Fetch CF credentials from KMS
        id: kms
        uses: ./.hanzo/actions/kms
        with:
          client-id: ${{ secrets.KMS_CLIENT_ID }}
          client-secret: ${{ secrets.KMS_CLIENT_SECRET }}
          endpoint: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          env: ${{ vars.KMS_SECRET_ENV || 'prod' }}

      # The project has to exist before a deploy can target it, and these two lanes
      # only ever deployed — so the first deploy of a brand-new site failed on
      # 'The Pages project "<name>" does not exist.' It sits AFTER the KMS read
      # because it needs that token, and continue-on-error because on every run
      # after the first the project is already there and create exits non-zero.
      - name: Create Cloudflare Pages project (if needed)
        continue-on-error: true
        run: npx wrangler pages project create bootnode-docs --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.kms.outputs.cf-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.kms.outputs.cf-account }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/bootnode-docs/out --project-name=bootnode-docs --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.kms.outputs.cf-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.kms.outputs.cf-account }}
