name: Deploy Cloud Landing Page

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/cloud/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.hanzo/workflows/deploy-cloud.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: hanzo-docs-build-linux-amd64
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @hanzo/cloud build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Fetch CF credentials from KMS
        id: kms
        uses: ./.hanzo/actions/kms
        with:
          client-id: ${{ secrets.KMS_CLIENT_ID }}
          client-secret: ${{ secrets.KMS_CLIENT_SECRET }}
          endpoint: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          env: ${{ vars.KMS_SECRET_ENV || 'prod' }}

      - name: Create Cloudflare Pages project (if needed)
        continue-on-error: true
        run: npx wrangler pages project create cloud-site --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.kms.outputs.cf-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.kms.outputs.cf-account }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/cloud/out --project-name=cloud-site --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.kms.outputs.cf-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.kms.outputs.cf-account }}
