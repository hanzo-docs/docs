name: Deploy Dev Docs

# dev-docs ships on the Hanzo Sites plane, served at dev-docs.hanzo.app.
#
#   pnpm build --filter=dev-docs  ->  apps/dev-docs/out  ->  sitedeploy
#
# sitedeploy is bin/sitedeploy in hanzoai/ci, reached through its action:
# ensure-project, enqueue, presigned per-file upload, complete. It creates the
# project itself, so this file has no create step.
#
# The deploy key is in KMS and the action reads it there; this file names only
# the client identity that opens it.
#
# A custom host is an ingress route in hanzo/universe,
# charts/app/values/hanzo/static-sites.yaml.

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/dev-docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.hanzo/workflows/deploy-dev-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: hanzo-docs-build-linux-amd64
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile

      - name: Build dev-docs
        run: pnpm build --filter=dev-docs
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        timeout-minutes: 30

      # complete prunes whatever the build did not emit, so an empty export
      # would empty the live site.
      - name: Refuse an empty export
        run: |
          set -euo pipefail
          n=$(find apps/dev-docs/out -type f | wc -l | tr -d ' ')
          [ "$n" -gt 10 ] || { echo "::error::apps/dev-docs/out holds $n files — that is not a built site"; exit 1; }
          test -f apps/dev-docs/out/index.html || { echo "::error::apps/dev-docs/out/index.html is missing"; exit 1; }
          echo "export holds $n files"

      # The 202 carries a prefix-scoped, expiring presigned grant, so no bucket
      # key is held here. SITES_S3_* is a standing credential reaching every
      # org's site; the grant replaces it.
      - name: Publish to the Sites plane
        uses: hanzoai/ci/.github/actions/sitedeploy@v1
        with:
          slug: dev-docs
          dir: apps/dev-docs/out
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
