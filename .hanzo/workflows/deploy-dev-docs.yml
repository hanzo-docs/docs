name: Deploy Dev Docs

# dev-docs ships on the Hanzo Sites plane, not Cloudflare Pages.
#
# Not a preference — Cloudflare refuses to make the project:
#
#   A request to the Cloudflare API (/accounts/…/pages/projects) failed.
#   You have reached the limit of projects you can have on your account.
#   [code: 8000027]
#
# So dev-docs had nowhere to land: no project, and dev.hanzo.ai answering 404.
# The other eight lanes here already have their projects and keep them; this is
# the one that needed a first home, and the plane is where our static surfaces
# live anyway — hanzo.ai, agency, logo, gallery and the lux sites all publish
# through the same script.
#
#   pnpm build --filter=dev-docs  ->  apps/dev-docs/out  ->  sitedeploy
#
# The publish mechanics are in bin/sitedeploy in hanzoai/ci, reached through its
# action: ensure-project, enqueue, presigned per-file upload, complete. It
# self-provisions, so no create step and no account quota to run into.
#
# The deploy key lives in KMS and the action opens it there, so this file names
# only the client identity — the same two secrets the Cloudflare lanes here use
# to read their own credentials.
#
# The site is served at dev-docs.hanzo.app. Pointing dev.hanzo.ai at it is an
# ingress route in universe, the way every other host on the plane is routed.

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/dev-docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.hanzo/workflows/deploy-dev-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: hanzo-docs-build-linux-amd64
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile

      - name: Build dev-docs
        run: pnpm build --filter=dev-docs
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        timeout-minutes: 30

      # An empty export would publish as an empty site, and complete prunes what
      # the build dropped — so refuse before publishing rather than after.
      - name: Refuse an empty export
        run: |
          set -euo pipefail
          n=$(find apps/dev-docs/out -type f | wc -l | tr -d ' ')
          [ "$n" -gt 10 ] || { echo "::error::apps/dev-docs/out holds $n files — that is not a built site"; exit 1; }
          test -f apps/dev-docs/out/index.html || { echo "::error::apps/dev-docs/out/index.html is missing"; exit 1; }
          echo "export holds $n files"

      # The 202 carries a prefix-scoped, expiring presigned grant, so nothing here
      # holds a bucket key. Do NOT add SITES_S3_* — that is the standing shared
      # credential the grant replaced, and it reaches every org's site.
      - name: Publish to the Sites plane
        uses: hanzoai/ci/.github/actions/sitedeploy@v1
        with:
          slug: dev-docs
          dir: apps/dev-docs/out
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
