name: Deploy Insights Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/insights-docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.hanzo/workflows/deploy-insights-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: hanzo-docs-build-linux-amd64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm build --filter=insights-docs
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Publish to the Sites plane
        uses: https://git.hanzo.ai/hanzoai/ci/.github/actions/site@v1
        with:
          slug: insights
          dir: apps/insights-docs/out
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
