name: Deploy ZT Docs

on:
  push:
    branches: [dev]
    paths:
      - 'apps/zt-docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.hanzo/workflows/deploy-zt-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: hanzo-docs-build-linux-amd64
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm build --filter=zt-docs
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Fetch CF credentials from KMS
        id: kms
        uses: ./.hanzo/actions/kms
        with:
          client-id: ${{ secrets.KMS_CLIENT_ID }}
          client-secret: ${{ secrets.KMS_CLIENT_SECRET }}
          endpoint: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          env: ${{ vars.KMS_SECRET_ENV || 'prod' }}

      - name: Create Cloudflare Pages project (if needed)
        continue-on-error: true
        run: npx wrangler pages project create zt-docs --production-branch=dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.kms.outputs.cf-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.kms.outputs.cf-account }}

      - run: npx wrangler pages deploy apps/zt-docs/out --project-name=zt-docs --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.kms.outputs.cf-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.kms.outputs.cf-account }}
