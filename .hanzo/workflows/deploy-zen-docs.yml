name: Deploy Zen Docs

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/zen-docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.hanzo/workflows/deploy-zen-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: hanzo-docs-build-linux-amd64
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22, like the other nine deploy lanes here. pnpm/action-setup above
          # fetches a pnpm that requires Node >= 22.13, so a 20 pin fails at this
          # step, before install and before build.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build --filter=zen-docs
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Fetch CF credentials from KMS
        id: kms
        uses: ./.hanzo/actions/kms
        with:
          client-id: ${{ secrets.KMS_CLIENT_ID }}
          client-secret: ${{ secrets.KMS_CLIENT_SECRET }}
          endpoint: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          env: ${{ vars.KMS_SECRET_ENV || 'prod' }}

      - name: Create Cloudflare Pages project (if needed)
        continue-on-error: true
        run: npx wrangler pages project create zen-docs --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.kms.outputs.cf-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.kms.outputs.cf-account }}

      - run: npx wrangler pages deploy apps/zen-docs/out --project-name=zen-docs --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.kms.outputs.cf-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.kms.outputs.cf-account }}
