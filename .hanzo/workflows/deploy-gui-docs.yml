name: Deploy GUI Docs

# gui.hanzo.ai, served from the object-store plane.
#
# `pnpm build --filter=gui-docs` writes a static export to apps/gui-docs/out, so
# the site action syncs that directory to s3://hanzo-sites/hanzo/gui and the
# `gui-static` route in universe serves it. No image, no pod.
#
# The host resolved to a Cloudflare Pages project, which was the last DNS record
# in the hanzo.ai zone that did — everything else already answers from our own
# ingress on the *.hanzo.ai wildcard. A page published there could not be
# rebuilt or rolled back from here.
#
# main only. The Pages deploy passed --production-branch=main, which made a push
# to any other branch a preview; the Sites plane has one prefix per slug, so the
# same trigger would have let a side branch overwrite what is live.

on:
  push:
    branches: [main]
    paths:
      - 'apps/gui-docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.hanzo/workflows/deploy-gui-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gui-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: hanzo-docs-build-linux-amd64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=gui-docs
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Publish to the Sites plane
        uses: https://git.hanzo.ai/hanzoai/ci/.github/actions/site@v1
        with:
          slug: gui
          dir: apps/gui-docs/out
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
