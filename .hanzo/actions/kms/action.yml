name: kms
description: Read the Cloudflare deploy credentials out of Hanzo KMS.

# Every deploy lane reads its Cloudflare credentials here.
#
# Path is flat: /v1/kms/secrets/deploy/<NAME>?env=<env>, and the org comes from
# the token. The /v1/kms/orgs/<org>/secrets/ form is served by a different
# instance and nests the value under .secret.value.
#
# Reads retry on 5xx and on a dropped connection, four tries over 32s. A 401 or
# 403 fails at once: that is the credential being refused, not the door being
# unreachable.

inputs:
  client-id:
    description: KMS machine identity
    required: true
  client-secret:
    description: KMS machine secret
    required: true
  endpoint:
    description: KMS base
    required: false
    default: https://kms.hanzo.ai
  env:
    description: Secret environment
    required: false
    default: prod

outputs:
  cf-token:
    description: CLOUDFLARE_API_TOKEN
    value: ${{ steps.read.outputs.cf_token }}
  cf-account:
    description: CLOUDFLARE_ACCOUNT_ID
    value: ${{ steps.read.outputs.cf_account }}

runs:
  using: composite
  steps:
    - id: read
      shell: bash
      env:
        KMS_CLIENT_ID: ${{ inputs.client-id }}
        KMS_CLIENT_SECRET: ${{ inputs.client-secret }}
        KMS_ENDPOINT: ${{ inputs.endpoint }}
        KMS_SECRET_ENV: ${{ inputs.env }}
      run: |
        set -euo pipefail

        # Retry only what is not an answer: a 5xx or a dead connection.
        # Anything the door decided is returned as-is.
        ask() {
          local url="$1"; shift
          local code body
          for wait in 0 3 9 20; do
            [ "$wait" = 0 ] || sleep "$wait"
            body=$(curl -sS -m 20 -w '\n%{http_code}' "$url" "$@" 2>/dev/null || true)
            code="${body##*$'\n'}"
            case "$code" in
              ''|000|5*) continue ;;
              *) printf '%s' "${body%$'\n'*}"; return 0 ;;
            esac
          done
          echo "::error::${url%%\?*} did not answer in four tries over 32s (last: ${code:-no response})"
          return 1
        }

        token=$(ask "${KMS_ENDPOINT}/v1/kms/auth/login" \
          -H 'Content-Type: application/json' \
          -d "{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}" \
          | jq -r '.accessToken // empty')
        if [ -z "${token}" ]; then
          echo "::error::KMS refused this identity at ${KMS_ENDPOINT}/v1/kms/auth/login — check KMS_CLIENT_ID and KMS_CLIENT_SECRET"
          exit 1
        fi

        get() {
          ask "${KMS_ENDPOINT}/v1/kms/secrets/deploy/$1?env=${KMS_SECRET_ENV}" \
            -H "Authorization: Bearer ${token}" | jq -r '.value // empty'
        }
        cf_token=$(get CLOUDFLARE_API_TOKEN)
        cf_account=$(get CLOUDFLARE_ACCOUNT_ID)
        if [ -z "${cf_token}" ] || [ -z "${cf_account}" ]; then
          echo "::error::deploy/CLOUDFLARE_API_TOKEN or deploy/CLOUDFLARE_ACCOUNT_ID is empty at ${KMS_ENDPOINT} (env ${KMS_SECRET_ENV})"
          exit 1
        fi

        echo "::add-mask::${cf_token}"
        echo "::add-mask::${cf_account}"
        echo "cf_token=${cf_token}" >> "$GITHUB_OUTPUT"
        echo "cf_account=${cf_account}" >> "$GITHUB_OUTPUT"
