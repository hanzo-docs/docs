<!doctype html>
<html lang="en" class="booting">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hanzo API Reference — the Open AI Cloud</title>
    <meta
      name="description"
      content="The full REST API reference for the Hanzo Open AI Cloud — every /v1 endpoint across all services, one key, generated from the OpenAPI 3.1 spec."
    />
    <link rel="icon" href="/logo.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
      }
      /* Anti-FOUC placeholder shown only until Scalar renders.
         Gated on html.booting — NOT on #app:empty — because Scalar mounts as a
         SIBLING of #app, so #app stays :empty forever and an :empty-gated
         placeholder becomes a permanent ghost pinned above the real reference
         (146px on mobile). The script below clears .booting once anything
         renders, so this can never outlive the load. */
      html.booting #app::before {
        content: 'Loading the Hanzo API reference…';
        display: block;
        padding: 4rem 2rem;
        color: #a3a3a3;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      /* Geist Sans + Geist Mono, SELF-HOSTED. Nothing is fetched from
         fonts.scalar.com: the bundle shipped 13 @font-face rules pointing there,
         our CSP is font-src 'self' data:, so all 13 were blocked on every load
         and the type silently fell back to whatever the OS had. Those rules are
         patched out of the vendored bundle AND the real fonts now ship beside it.

         One variable file per family covers every weight (100-900), so this is
         two requests, same-origin, ~141KB total — not ten static cuts. */
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/reference/fonts/geist-sans.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/reference/fonts/geist-mono.woff2') format('woff2');
      }
      /* Scalar's OWN theming seam — it reads these custom properties everywhere
         it sets type, so overriding them beats fighting its selectors with
         !important and survives a bundle upgrade. */
      :root,
      .scalar-app {
        --scalar-font: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
        --scalar-font-code: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      }
      body,
      .scalar-app {
        font-family: var(--scalar-font);
      }
      code,
      pre,
      .scalar-app code,
      .scalar-app pre {
        font-family: var(--scalar-font-code);
      }
</style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Full interactive reference for the unified Hanzo API (hanzo.yaml).
         The Scalar bundle, the spec, and the two Geist woff2 files all ship with
         this static export, so the page makes ZERO third-party requests. Served
         by hanzoai/static at docs.hanzo.ai/reference/. -->
    <script
      id="api-reference"
      type="application/json"
      data-url="/openapi/hanzo.yaml"
    ></script>
    <script>
      var configuration = {
        theme: 'default',
        darkMode: true,
        hideDownloadButton: false,
        metaData: {
          title: 'Hanzo API Reference',
          description: 'The Open AI Cloud — one API for every service.',
        },
      };
      document.getElementById('api-reference').dataset.configuration =
        JSON.stringify(configuration);
    </script>
    <script src="/reference/scalar.standalone.js"></script>
    <script id="booting-clear">
      // Scalar mounts as a sibling of #app, so we cannot detect readiness via
      // #app:empty. Clear on the first added node anywhere in body, with a load
      // fallback so the placeholder can never persist.
      (function () {
        var done = function () {
          document.documentElement.classList.remove('booting');
          if (obs) obs.disconnect();
        };
        var obs = new MutationObserver(function (muts) {
          for (var i = 0; i < muts.length; i++) if (muts[i].addedNodes.length) return done();
        });
        obs.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('load', function () { setTimeout(done, 1500); });
      })();
    </script>
  </body>
</html>
