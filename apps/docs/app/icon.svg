<!--
  The brand mark, and the SAME one hanzo.ai serves at /favicon.svg — byte-for-byte
  the same geometry, the same full-bleed viewBox, the same colour rule.

  It used to be this mark inset ~13% inside a black rounded rectangle, with two
  extra shaded paths the brand mark does not have. That is a second favicon for
  one company: on a light tab strip hanzo.ai showed a clean H and docs showed a
  black tile, so the two sites did not read as the same product.

  The fill follows the tab strip rather than being painted on: black on light,
  white on dark. A boxed mark cannot do that — the box is opaque, so it carries
  its own background into whatever the browser draws behind it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 67 67" role="img" aria-label="Hanzo">
<style>path{fill:#000}@media (prefers-color-scheme:dark){path{fill:#fff}}</style>
<path d="M22.21 67V44.6369H0V67H22.21Z"/>
<path d="M66.7038 22.3184H22.2534L0.0878906 44.6367H44.4634L66.7038 22.3184Z"/>
<path d="M22.21 0H0V22.3184H22.21V0Z"/>
<path d="M66.7198 0H44.5098V22.3184H66.7198V0Z"/>
<path d="M66.7198 67V44.6369H44.5098V67H66.7198Z"/>
</svg>
