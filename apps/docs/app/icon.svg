<!--
  Favicon framing. The mark's geometry is untouched — it is the shared brand mark,
  drawn identically by the header. Only the viewBox that frames it moved.

  It was viewBox="0 0 67 67" while the mark occupies x 4..53.6 and y 4..54, so the
  padding was 4 on the left and top but ~13 on the right and bottom. At 16px in a
  tab that reads as a lopsided glyph pushed into one corner.

  The size 67 was already right and is kept: measured against the shipped icon.png
  (256px, mark bbox 32..222 on both axes) the mark is 74% of the canvas, and
  50 / 0.746 = 67. Only the ORIGIN moves. The mark centres on (28.8, 29), so
  shifting the box to (-4.7, -4.5) puts 8.7 and 8.5 units of padding on all four
  sides — the same 13% the PNG has.

  rx matches the PNG's rounded corner, which this file was missing entirely: the
  SVG and the PNG were two different shapes.
-->
<svg viewBox="-4.7 -4.5 67 67" xmlns="http://www.w3.org/2000/svg">
  <rect x="-4.7" y="-4.5" width="67" height="67" rx="10.5" fill="#000000"/>
  <g>
    <path d="M17 54V36.1H4V54H17Z" fill="#ffffff"/>
    <path d="M4 36.1L17 37.6V36.1H4Z" fill="#DDDDDD" opacity="0.7"/>
    <path d="M53.6 17.4H17.2L4 36.1H40.3L53.6 17.4Z" fill="#ffffff"/>
    <path d="M17 4H4V17.4H17V4Z" fill="#ffffff"/>
    <path d="M53.6 4H40.4V17.4H53.6V4Z" fill="#ffffff"/>
    <path d="M53.6 17.4L40.4 15.7V17.4H53.6Z" fill="#DDDDDD" opacity="0.7"/>
    <path d="M53.6 54V36.1H40.4V54H53.6Z" fill="#ffffff"/>
  </g>
</svg>
