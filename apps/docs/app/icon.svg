<!--
  The brand mark, and nothing around it — byte-for-byte the geometry hanzo.ai
  serves at /favicon.svg, so the tab for docs.hanzo.ai and the tab for hanzo.ai
  are the same picture.

  What this replaces was the mark inside a filled, rounded black tile. Two things
  were wrong with that and only one of them is visible at a glance. The tile is
  not part of the mark — no other Hanzo surface draws one — so docs sat in a row
  of tabs looking like a different company. And a baked tile cannot answer the
  theme: white-on-black is legible on a dark tab strip and a heavy blot on a light
  one, where every sibling tab is showing a light mark.

  The `style` block is what fixes the second half. `prefers-color-scheme` inside
  an SVG referenced by `<link rel="icon">` is evaluated against the BROWSER's
  theme, so the glyph is #000 on a light tab strip and #fff on a dark one, with no
  second file and no tile to hide behind. The viewBox is 0 0 67 67 with the mark
  filling it — the framing IS the mark's own bounding box, which is why it needs
  no padding decision.

  There is no icon.png beside this. Next emits a `<link>` for every icon
  convention it finds, so an opaque 256px PNG next to this file is a second answer
  to the same question that some browsers prefer — which is how the tile survived
  a change to the SVG. apple-icon.png stays: iOS composites its tile on an opaque
  ground and draws its own rounded corners, so an opaque source is correct there
  and only there.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 67 67" role="img" aria-label="Hanzo">
<style>path{fill:#000}@media (prefers-color-scheme:dark){path{fill:#fff}}</style>
<path d="M22.21 67V44.6369H0V67H22.21Z"/>
<path d="M66.7038 22.3184H22.2534L0.0878906 44.6367H44.4634L66.7038 22.3184Z"/>
<path d="M22.21 0H0V22.3184H22.21V0Z"/>
<path d="M66.7198 0H44.5098V22.3184H66.7198V0Z"/>
<path d="M66.7198 67V44.6369H44.5098V67H66.7198Z"/>
</svg>
