# The GitHub lane: hanzoai/ci, driven by this repo's root hanzo.yml.
#
# Manual only, and that is deliberate. `.hanzo/workflows/deploy.yml` is the
# builder that fires by itself; two push-triggered builders for one image means
# one commit produces two images under two different tag schemes, and the pin in
# hanzoai/universe then names one of them by luck. So exactly one of the two is
# ever armed, and this is the one a human arms.
#
# It also cannot schedule today, and the reason is not Actions. Actions is ON for
# this repo (`{"enabled":true,"allowed_actions":"all"}`) and the repo is public,
# so a run dispatches fine — it just has nowhere to run. Every runner we own is
# an act_runner registered to git.hanzo.ai, not to github.com; arcd, which was
# the GitHub-side pool, is retired, and the one leftover registration on this org
# (hanzo-docs-build-linux-amd64-5dzd2-runner-dcm4t) is offline and advertises no
# labels. A run started now sits pending against a runner GitHub cannot see.
#
# The fix is to register one of our runners against this org, NOT to reach for
# ubuntu-latest. GitHub-hosted runners are the one thing this fleet does not
# build on, and a workflow that names one executes immediately and quietly makes
# that untrue. The runner label below is the same one the forge lane already
# answers to, so the two lanes never disagree about where a build belongs.
#
# `submodules: recursive` is load-bearing, not tidiness. Doc sections live in
# submodules under apps/docs/content/docs/ (today: studio, from
# hanzo-docs/studio-docs, which is public — the job's own token can read it).
# hanzoai/ci checks out with checkout's default, which fetches none of them, and
# a missing submodule is silent: the directory is empty, every other page still
# builds, and the site ships without that section. Here it would not ship at all
# — export.require names those pages, so the export gate fails the build — which
# is the intended failure, and this line is what keeps it from being the one this
# lane always hits. The forge lane has passed `recursive` all along; this makes
# the two lanes check out the same source.
name: CI/CD
on:
  # ONE cloud release, every projection. hanzoai/ci's client: lane
  # (hanzo.yml) is what this fires.
  repository_dispatch: { types: [spec-update] }
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    with:
      runner: '["hanzo-docs-build-linux-amd64"]'
      submodules: recursive
    secrets: inherit
