# The one GitHub-side job. Builds run on Hanzo Git from .hanzo/workflows/, so
# main has to reach the forge — this pushes it there and does nothing else. It
# went missing when .github/workflows was emptied, and docs.hanzo.ai then served
# a build from 24 August while main moved twelve commits.
name: Sync main to Hanzo Git
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          HANZO_GIT_TOKEN: ${{ secrets.HANZO_GIT_TOKEN }}
        run: |
          set -euo pipefail
          # FORGE_TOKEN is the fleet's git.hanzo.ai write credential (the identity
          # every other write-back uses); HANZO_GIT_TOKEN is the older one the image
          # build reads.
          export GIT_TERMINAL_PROMPT=0
          # Hanzo Git checks basic auth as <token owner>:<token>, so the owner has
          # to be named; hanzo-dev is the fleet's service identity.
          for tok in "$FORGE_TOKEN" "$HANZO_GIT_TOKEN"; do
            [ -n "$tok" ] || continue
            for user in hanzo-dev hanzoai; do
              if git push "https://${user}:${tok}@git.hanzo.ai/hanzoai/docs.git" HEAD:refs/heads/main; then
                exit 0
              fi
            done
          done
          echo "::error::no configured token could push to git.hanzo.ai; the forge never sees this push"
          exit 1
