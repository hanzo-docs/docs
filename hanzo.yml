# CI config for hanzo-docs/docs, read by hanzoai/ci build.yml (called from
# .hanzo/workflows/cicd.yml on git.hanzo.ai). It ships one thing: the static
# export of apps/docs, published to the Sites plane and served at docs.hanzo.ai.
# RELEASE.md has the whole path.

test:
  - name: docs
    # The vitest project for apps/docs, against the workspace packages it
    # imports, built first because their package exports resolve to dist/. It
    # pins the surfaces the site prints: the SDK method names (openapi-
    # generator's own derivation) and the MCP tool names, asserted against real
    # generated clients and a real tools/list answer, plus the CLI commands and
    # models the first-call pages name. A drift in any of them fails here rather
    # than teaching a call that does not exist.
    run: >-
      pnpm install --frozen-lockfile &&
      pnpm turbo run build --filter='docs^...' &&
      pnpm vitest run --project docs

# The publish. hanzoai/ci runs `build` on its publish job, a fresh runner, after
# `test` is green, then uploads `dir` as Sites project `slug`: prefix
# s3://hanzo-sites/hanzo/docs-hanzo-ai, which the docs.hanzo.ai route serves.
# The project is named for its host because `docs` is a reserved label on the
# Sites plane (cloud apps/sites/reserved.go). scripts/site.sh installs, builds
# and checks the export; the checkout carries the submodules it needs
# (cicd.yml passes submodules: recursive).
site:
  slug: docs-hanzo-ai
  dir: apps/docs/out
  build: bash scripts/site.sh
  on: [main]

# The KMS tenant the publish job reads its deploy token from.
kms:
  org: hanzo
